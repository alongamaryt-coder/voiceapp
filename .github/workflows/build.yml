name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QuickTalk'
          include ':app'
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.5.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx3g' > gradle.properties
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.md.quicktalk'
          compileSdk 34
          defaultConfig {
          applicationId 'com.md.quicktalk'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          <application android:label="QuickTalk" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          <service android:name=".VoiceService" android:exported="false" android:foregroundServiceType="microphone" />
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/quicktalk/MainActivity.kt)
          cat > app/src/main/java/com/md/quicktalk/MainActivity.kt << 'EOF'
          package com.md.quicktalk
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          class MainActivity : Activity() {
          private val h = Handler(Looper.getMainLooper())
          private lateinit var nameBox: EditText
          private fun prefs() = getSharedPreferences("p", 0)
          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          window.statusBarColor = Color.BLACK
          window.navigationBarColor = Color.BLACK
          setContentView(splash())
          h.postDelayed({ setContentView(login()) }, 2500)
          }
          private fun splash(): View {
          val l = LinearLayout(this)
          l.orientation = LinearLayout.VERTICAL
          l.gravity = Gravity.CENTER
          l.setBackgroundColor(Color.BLACK)
          val t1 = TextView(this)
          t1.text = "Welcome to the QuickTalk App"
          t1.setTextColor(Color.WHITE)
          t1.textSize = 24f
          t1.gravity = Gravity.CENTER
          val t2 = TextView(this)
          t2.text = "Created by MD Sahil Sheikh"
          t2.setTextColor(Color.GRAY)
          t2.textSize = 14f
          t2.gravity = Gravity.CENTER
          t2.setPadding(0, 32, 0, 0)
          l.addView(t1)
          l.addView(t2)
          return l
          }
          private fun login(): View {
          val l = LinearLayout(this)
          l.orientation = LinearLayout.VERTICAL
          l.gravity = Gravity.CENTER
          l.setBackgroundColor(Color.BLACK)
          l.setPadding(48, 48, 48, 48)
          val t = TextView(this)
          t.text = "QuickTalk"
          t.setTextColor(Color.WHITE)
          t.textSize = 28f
          t.gravity = Gravity.CENTER
          t.setPadding(0, 0, 0, 32)
          nameBox = EditText(this)
          nameBox.hint = "Username"
          nameBox.setTextColor(Color.WHITE)
          nameBox.setHintTextColor(Color.GRAY)
          nameBox.setSingleLine(true)
          nameBox.setText(prefs().getString("name", ""))
          val sw = Switch(this)
          sw.text = "अलार्म की तरह रिंग करो"
          sw.setTextColor(Color.WHITE)
          sw.isChecked = prefs().getBoolean("alarm", true)
          sw.setOnCheckedChangeListener { _, c -> prefs().edit().putBoolean("alarm", c).apply() }
          sw.setPadding(0, 32, 0, 32)
          val bt = Button(this)
          bt.text = "Join"
          bt.setOnClickListener { go() }
          l.addView(t)
          l.addView(nameBox)
          l.addView(sw)
          l.addView(bt)
          return l
          }
          private fun go() {
          val n = nameBox.text.toString().trim()
          if (n.isEmpty()) { Toast.makeText(this, "Username likho", Toast.LENGTH_SHORT).show(); return }
          prefs().edit().putString("name", n).apply()
          if (!Settings.canDrawOverlays(this)) {
          Toast.makeText(this, "Allow 'Display over other apps', phir Join dobara dabao", Toast.LENGTH_LONG).show()
          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
          return
          }
          val need = ArrayList<String>()
          if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.RECORD_AUDIO)
          if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) need.add(Manifest.permission.POST_NOTIFICATIONS)
          if (need.isNotEmpty()) { requestPermissions(need.toTypedArray(), 1); return }
          val pm = getSystemService(PowerManager::class.java)
          if (!pm.isIgnoringBatteryOptimizations(packageName) && !prefs().getBoolean("bat", false)) {
          prefs().edit().putBoolean("bat", true).apply()
          Toast.makeText(this, "Battery: Allow/Unrestricted karo, phir Join dobara dabao", Toast.LENGTH_LONG).show()
          startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName")))
          return
          }
          startForegroundService(Intent(this, VoiceService::class.java).putExtra("name", n))
          Toast.makeText(this, "Overlay chalu ho gaya", Toast.LENGTH_SHORT).show()
          finish()
          }
          override fun onRequestPermissionsResult(rc: Int, p: Array<out String>, r: IntArray) {
          if (r.isNotEmpty() && r.all { it == PackageManager.PERMISSION_GRANTED }) go()
          else Toast.makeText(this, "Mic permission zaroori hai", Toast.LENGTH_LONG).show()
          }
          }
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/quicktalk/VoiceService.kt)
          cat > app/src/main/java/com/md/quicktalk/VoiceService.kt << 'EOF'
          package com.md.quicktalk
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.os.*
          import android.text.Editable
          import android.text.TextWatcher
          import android.view.*
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.*
          import okhttp3.*
          import okio.ByteString
          import okio.ByteString.Companion.toByteString
          import org.json.JSONObject
          import java.util.concurrent.LinkedBlockingQueue
          import java.util.concurrent.TimeUnit
          private fun enc(s: Int): Byte {
          var x = s
          var sign = 0
          if (x < 0) { x = -x; sign = 0x80 }
          if (x > 32635) x = 32635
          x += 132
          var e = 7
          var mask = 0x4000
          while (e > 0 && (x and mask) == 0) { e--; mask = mask shr 1 }
          val man = (x shr (e + 3)) and 0x0F
          return (sign or (e shl 4) or man).inv().toByte()
          }
          private fun dec(b: Byte): Short {
          val u = b.toInt().inv() and 0xFF
          val e = (u shr 4) and 7
          val man = u and 15
          val s = (((man shl 3) + 132) shl e) - 132
          return (if ((u and 0x80) != 0) -s else s).toShort()
          }
          class VoiceService : Service() {
          private val SERVER = "wss://voiceapp-rhcc.onrender.com"
          private val SR = 16000
          private val ui = Handler(Looper.getMainLooper())
          private val http = OkHttpClient.Builder().connectTimeout(70, TimeUnit.SECONDS).pingInterval(25, TimeUnit.SECONDS).build()
          private lateinit var wm: WindowManager
          private lateinit var root: FrameLayout
          private lateinit var panel: LinearLayout
          private lateinit var dot: TextView
          private lateinit var status: TextView
          private lateinit var search: EditText
          private lateinit var b1: Button
          private lateinit var b2: Button
          private lateinit var adapter: ArrayAdapter<String>
          private lateinit var lp: WindowManager.LayoutParams
          private val shown = ArrayList<String>()
          private var all: List<String> = emptyList()
          private var filter = ""
          private var me = ""
          private var alive = false
          private var connected = false
          private var overlayOn = false
          private var note: String? = null
          private var gen = 0
          @Volatile private var ws: WebSocket? = null
          @Volatile private var state = 0
          @Volatile private var peer = ""
          @Volatile private var talking = false
          @Volatile private var muted = false
          private var rec: AudioRecord? = null
          private var trk: AudioTrack? = null
          private val q = LinkedBlockingQueue<ByteArray>()
          private var player: MediaPlayer? = null
          private var vib: Vibrator? = null
          private val timeout = Runnable {
          if (state == 1) { sendJ("end", peer); setIdle("No answer") }
          else if (state == 2) { sendJ("reject", peer); setIdle("Missed call") }
          }
          private val reconn = Runnable { connect() }
          override fun onBind(i: Intent?): IBinder? = null
          private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
          override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
          if (i == null || i.action == "STOP") { stopSelf(); return START_NOT_STICKY }
          val n = i.getStringExtra("name") ?: ""
          if (n.isEmpty()) { stopSelf(); return START_NOT_STICKY }
          startFg()
          me = n
          if (alive) {
          ws?.cancel()
          ui.removeCallbacks(reconn)
          connected = false
          render()
          connect()
          return START_NOT_STICKY
          }
          alive = true
          wm = getSystemService(WINDOW_SERVICE) as WindowManager
          buildOverlay()
          render()
          connect()
          return START_NOT_STICKY
          }
          private fun startFg() {
          val nm = getSystemService(NotificationManager::class.java)
          nm.createNotificationChannel(NotificationChannel("q", "QuickTalk", NotificationManager.IMPORTANCE_LOW))
          val stop = PendingIntent.getService(this, 0, Intent(this, VoiceService::class.java).setAction("STOP"), PendingIntent.FLAG_IMMUTABLE)
          val n = Notification.Builder(this, "q")
          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
          .setContentTitle("QuickTalk chalu hai")
          .setContentText("Band karne ke liye Stop dabao")
          .addAction(0, "Stop", stop)
          .build()
          if (Build.VERSION.SDK_INT >= 29) startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
          else startForeground(1, n)
          }
          private fun buildOverlay() {
          root = FrameLayout(this)
          panel = LinearLayout(this)
          panel.orientation = LinearLayout.VERTICAL
          panel.setPadding(dp(8), dp(8), dp(8), dp(8))
          val bg = GradientDrawable()
          bg.setColor(Color.parseColor("#111111"))
          bg.cornerRadius = dp(12).toFloat()
          panel.background = bg
          val top = LinearLayout(this)
          top.orientation = LinearLayout.HORIZONTAL
          top.gravity = Gravity.CENTER_VERTICAL
          status = TextView(this)
          status.setTextColor(Color.WHITE)
          status.textSize = 12f
          top.addView(status, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
          val hide = TextView(this)
          hide.text = "—"
          hide.setTextColor(Color.WHITE)
          hide.textSize = 20f
          hide.setPadding(dp(12), 0, dp(4), 0)
          hide.setOnClickListener { collapse(true) }
          top.addView(hide)
          panel.addView(top)
          search = EditText(this)
          search.hint = "Search"
          search.setHintTextColor(Color.GRAY)
          search.setTextColor(Color.WHITE)
          search.textSize = 13f
          search.setSingleLine(true)
          search.imeOptions = EditorInfo.IME_ACTION_DONE
          search.addTextChangedListener(object : TextWatcher {
          override fun afterTextChanged(s: Editable?) { filter = s.toString(); refreshList() }
          override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
          })
          search.setOnTouchListener { _, e ->
          if (e.action == MotionEvent.ACTION_DOWN && (lp.flags and WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE) != 0) {
          setFocusable(true)
          ui.postDelayed({
          search.requestFocus()
          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).showSoftInput(search, 0)
          }, 150)
          }
          false
          }
          search.setOnEditorActionListener { _, _, _ -> setFocusable(false); true }
          panel.addView(search)
          adapter = object : ArrayAdapter<String>(this@VoiceService, android.R.layout.simple_list_item_1, shown) {
          override fun getView(p: Int, v: View?, g: ViewGroup): View {
          val t = super.getView(p, v, g) as TextView
          t.setTextColor(Color.WHITE)
          t.textSize = 14f
          return t
          }
          }
          val list = ListView(this)
          list.adapter = adapter
          list.setOnItemClickListener { _, _, p, _ -> if (state == 0 && p < shown.size) callUser(shown[p]) }
          panel.addView(list, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(200)))
          val row = LinearLayout(this)
          row.orientation = LinearLayout.HORIZONTAL
          b1 = Button(this)
          b1.textSize = 12f
          b1.isAllCaps = false
          b1.setOnClickListener { onB1() }
          b2 = Button(this)
          b2.textSize = 12f
          b2.isAllCaps = false
          b2.setOnClickListener { onB2() }
          row.addView(b1, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
          row.addView(b2, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
          panel.addView(row)
          dot = TextView(this)
          dot.text = "●"
          dot.gravity = Gravity.CENTER
          dot.setTextColor(Color.WHITE)
          dot.textSize = 18f
          val dbg = GradientDrawable()
          dbg.shape = GradientDrawable.OVAL
          dbg.setColor(Color.parseColor("#2E7D32"))
          dot.background = dbg
          dot.visibility = View.GONE
          dot.setOnClickListener { collapse(false) }
          root.addView(panel, FrameLayout.LayoutParams(dp(190), FrameLayout.LayoutParams.WRAP_CONTENT))
          root.addView(dot, FrameLayout.LayoutParams(dp(36), dp(36)))
          root.alpha = 0.55f
          root.setOnTouchListener { _, e -> if (e.action == MotionEvent.ACTION_OUTSIDE) setFocusable(false); false }
          lp = WindowManager.LayoutParams(
          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH,
          PixelFormat.TRANSLUCENT
          )
          lp.gravity = Gravity.END or Gravity.CENTER_VERTICAL
          wm.addView(root, lp)
          overlayOn = true
          }
          private fun setFocusable(f: Boolean) {
          if (!overlayOn) return
          val nf = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH or
          (if (f) 0 else WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE)
          if (lp.flags == nf) return
          lp.flags = nf
          wm.updateViewLayout(root, lp)
          if (!f) {
          (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager).hideSoftInputFromWindow(root.windowToken, 0)
          search.clearFocus()
          }
          }
          private fun collapse(on: Boolean) {
          setFocusable(false)
          panel.visibility = if (on) View.GONE else View.VISIBLE
          dot.visibility = if (on) View.VISIBLE else View.GONE
          root.alpha = if (on) 0.25f else 0.55f
          }
          private fun refreshList() {
          shown.clear()
          shown.addAll(all.filter { it != me && it.contains(filter, true) })
          adapter.notifyDataSetChanged()
          }
          private fun render() {
          status.text = when {
          !connected -> "Connecting... (pehli baar 1 min lag sakta hai)"
          state == 1 -> "Calling $peer..."
          state == 2 -> "$peer is calling"
          state == 3 -> "In call: $peer"
          else -> note ?: "Online: $me"
          }
          b1.visibility = if (state == 2 || state == 3) View.VISIBLE else View.GONE
          b1.text = if (state == 2) "Accept" else if (muted) "Unmute" else "Mute"
          b2.visibility = if (state == 0) View.GONE name: Build APK
