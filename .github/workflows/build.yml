name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Write project files
        run: |
          mkdir -p $(dirname settings.gradle)
          cat > settings.gradle << 'EOF'
          pluginManagement {
          repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
          repositories { google(); mavenCentral() }
          }
          rootProject.name = 'QuickTalk'
          include ':app'
          EOF
          mkdir -p $(dirname build.gradle)
          cat > build.gradle << 'EOF'
          plugins {
          id 'com.android.application' version '8.5.2' apply false
          id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          echo 'org.gradle.jvmargs=-Xmx3g' > gradle.properties
          mkdir -p $(dirname app/build.gradle)
          cat > app/build.gradle << 'EOF'
          plugins {
          id 'com.android.application'
          id 'org.jetbrains.kotlin.android'
          }
          android {
          namespace 'com.md.quicktalk'
          compileSdk 34
          defaultConfig {
          applicationId 'com.md.quicktalk'
          minSdk 26
          targetSdk 34
          versionCode 1
          versionName '1.0'
          }
          compileOptions {
          sourceCompatibility JavaVersion.VERSION_17
          targetCompatibility JavaVersion.VERSION_17
          }
          kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          <uses-permission android:name="android.permission.INTERNET" />
          <uses-permission android:name="android.permission.RECORD_AUDIO" />
          <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
          <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          <uses-permission android:name="android.permission.VIBRATE" />
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
          <application android:label="QuickTalk" android:theme="@android:style/Theme.Material.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true">
          <intent-filter>
          <action android:name="android.intent.action.MAIN" />
          <category android:name="android.intent.category.LAUNCHER" />
          </intent-filter>
          </activity>
          <service android:name=".VoiceService" android:exported="false" android:foregroundServiceType="microphone" />
          </application>
          </manifest>
          EOF
          mkdir -p $(dirname app/src/main/java/com/md/quicktalk/MainActivity.kt)
          cat > app/src/main/java/com/md/quicktalk/MainActivity.kt << 'EOF'
          package com.md.quicktalk
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          class MainActivity : Activity() {
          private val h = Handler(Looper.getMainLooper())
          private lateinit var nameBox: EditText
          private fun prefs() = getSharedPreferences("p", 0)
          override fun onCreate(b: Bundle?) {
          super.onCreate(b)
          window.statusBarColor = Color.BLACK
          window.navigationBarColor = Color.BLACK
          setContentView(splash())
          h.postDelayed({ setContentView(login()) }, 2500)
          }
          private fun splash(): View {
          val l = LinearLayout(this)
          l.orientation = LinearLayout.VERTICAL
          l.gravity = Gravity.CENTER
          l.setBackgroundColor(Color.BLACK)
          val t1 = TextView(this)
          t1.text = "Welcome to the QuickTalk App"
          t1.setTextColor(Color.WHITE)
          t1.textSize = 24f
          t1.gravity = Gravity.CENTER
          val t2 = TextView(this)
          t2.text = "Created by MD Sahil Sheikh"
          t2.setTextColor(Color.GRAY)
          t2.textSize = 14f
          t2.gravity = Gravity.CENTER
          t2.setPadding(0, 32, 0, 0)
          l.addView(t1)
          l.addView(t2)
          return l
          }
          
